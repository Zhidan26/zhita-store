<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zhita Store - Top Up & Gamepass</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      :root {
        /* Light Mode */
        --bg-main: #f8f9fa;
        --bg-card: #ffffff;
        --text-dark: #2d3436;

        --border-color: #2d3436;
        --shadow-color: #2d3436;

        --hero-bg: linear-gradient(135deg, #ff7eb3 0%, #ff758c 100%);
        --hero-text: #ffffff;

        --tab-inactive: #ffffff;
        --bottom-bar: rgba(255, 255, 255, 0.85);
        --input-bg: #ffffff;

        --primary: #ff5fa2;
        --secondary: #5edfff;
        --accent: #ffd84d;

        --btn-plus: #00b894;
        --btn-minus: #ff7675;
      }

      body.dark-mode {
        /* Dark Mode */
        --bg-main: #0f0c20;
        --bg-card: #1e1936;
        --text-dark: #f1f2f6;

        --border-color: #9c88ff;
        --shadow-color: #000000;

        --hero-bg: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
        --hero-text: #ffffff;

        --tab-inactive: #2d244c;
        --bottom-bar: rgba(30, 25, 54, 0.85);
        --input-bg: #2d244c;

        --primary: #ff79c6;
        --secondary: #70d6ff;
        --accent: #feca57;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-main);
        color: var(--text-dark);
        font-family: "Nunito", sans-serif;
        padding-bottom: 120px;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
        background-image:
          radial-gradient(
            circle at 10% 20%,
            rgba(255, 95, 162, 0.05) 0%,
            transparent 40%
          ),
          radial-gradient(
            circle at 90% 80%,
            rgba(94, 223, 255, 0.05) 0%,
            transparent 40%
          );
        background-attachment: fixed;
      }

      /* Loader */
      #loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--hero-bg);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        transition:
          opacity 0.5s ease,
          visibility 0.5s;
      }
      #loader img {
        width: 120px;
        border-radius: 25px;
        border: 4px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        animation: pulseLogo 1.5s infinite alternate
          cubic-bezier(0.4, 0, 0.2, 1);
      }
      @keyframes pulseLogo {
        0% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4);
        }
        100% {
          transform: scale(1.05);
          box-shadow: 0 0 20px 10px rgba(255, 255, 255, 0);
        }
      }

      /* Fake Alert Toast */
      #fake-alert {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(-150px);
        background: var(--bg-card);
        border: 2px solid var(--border-color);
        padding: 12px 20px;
        border-radius: 50px;
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 2000;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        min-width: 300px;
        justify-content: center;
      }
      #fake-alert.show {
        transform: translateX(-50%) translateY(0);
      }
      #alert-content {
        font-size: 0.9em;
      }

      /* Hero Section */
      .hero {
        position: relative;
        text-align: center;
        padding: 50px 20px 40px;
        background: var(--hero-bg);
        border-bottom-left-radius: 40px;
        border-bottom-right-radius: 40px;
        margin-bottom: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }
      .hero::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: url('data:image/svg+xml;utf8,<svg width="20" height="20" xmlns="http://www.w3.org/2000/svg"><circle cx="2" cy="2" r="2" fill="rgba(255,255,255,0.1)"/></svg>');
        opacity: 0.5;
      }
      .store-logo {
        max-width: 160px;
        width: 100%;
        margin: 0 auto 15px;
        display: block;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        position: relative;
        z-index: 2;
        transition: transform 0.3s ease;
      }
      .store-logo:hover {
        transform: scale(1.05) rotate(-3deg);
      }
      .hero p {
        color: var(--hero-text);
        font-family: "Fredoka", sans-serif;
        font-size: 1.1em;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.2);
        display: inline-block;
        padding: 8px 25px;
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(10px);
        position: relative;
        z-index: 2;
        letter-spacing: 0.5px;
      }

      /* Theme Toggle */
      .theme-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: white;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        font-size: 1.2em;
        cursor: pointer;
        z-index: 10;
        backdrop-filter: blur(5px);
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.3s ease;
      }
      .theme-btn:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: rotate(15deg);
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 0 20px;
      }

      /* Testimonials */
      .testi-container {
        margin: 10px 0 30px;
      }
      .testi-title {
        font-family: "Fredoka";
        font-size: 1.2em;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .testi-wrapper {
        display: flex;
        gap: 15px;
        overflow-x: auto;
        padding: 5px 5px 15px;
        scrollbar-width: none;
        scroll-behavior: smooth;
      }
      .testi-wrapper::-webkit-scrollbar {
        display: none;
      }
      .testi-card {
        min-width: 130px;
        height: 180px;
        background: var(--bg-card);
        border-radius: 16px;
        border: 2px solid var(--border-color);
        overflow: hidden;
        flex-shrink: 0;
        box-shadow: 4px 4px 0px var(--shadow-color);
        position: relative;
        transition: transform 0.2s ease;
      }
      .testi-card:hover {
        transform: translateY(-5px);
      }
      .testi-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .testi-caption {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
        color: #fff;
        font-size: 0.85em;
        padding: 15px 10px 8px;
        text-align: center;
        font-family: "Fredoka";
        font-weight: 500;
      }

      /* Custom Image Classes */
      .tab-icon {
        width: 20px;
        vertical-align: middle;
        margin-right: 5px;
      }
      .robux-img {
        width: 50px;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.15));
      }
      .pay-img {
        height: 24px;
        vertical-align: middle;
        object-fit: contain;
      }

      /* Tabs */
      .tabs {
        position: sticky;
        top: 15px;
        z-index: 100;
        background: var(--bg-main);
        display: flex;
        gap: 12px;
        margin-bottom: 25px;
        overflow-x: auto;
        padding: 10px;
        border-radius: 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        scrollbar-width: none;
        border: 2px solid var(--border-color);
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }
      .tab-btn {
        background: var(--tab-inactive);
        color: var(--text-dark);
        border: 2px solid var(--border-color);
        padding: 12px 20px;
        border-radius: 12px;
        font-family: "Fredoka";
        font-weight: 600;
        cursor: pointer;
        box-shadow: 3px 3px 0px var(--shadow-color);
        transition: all 0.2s ease;
        white-space: nowrap;
        display: flex;
        align-items: center;
      }
      .tab-btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 5px 5px 0px var(--shadow-color);
      }
      .tab-btn.active {
        background: var(--accent);
        color: #000;
        transform: translate(3px, 3px);
        box-shadow: 0px 0px 0px var(--shadow-color);
        border-color: #000;
      }

      /* Products */
      .category-section {
        display: none;
        animation: fadeScale 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .category-section.active {
        display: block;
      }
      @keyframes fadeScale {
        0% {
          opacity: 0;
          transform: scale(0.95) translateY(10px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }
      @media (min-width: 600px) {
        .product-grid {
          grid-template-columns: repeat(3, 1fr);
          gap: 20px;
        }
      }

      .card {
        background: var(--bg-card);
        border: 2px solid var(--border-color);
        border-radius: 18px;
        padding: 15px;
        text-align: center;
        box-shadow: 4px 4px 0px var(--shadow-color);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
      }
      .card:hover {
        transform: translateY(-5px);
        box-shadow: 6px 8px 0px var(--shadow-color);
      }
      .card-icon {
        font-size: 2.5em;
        margin-bottom: 10px;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
        display: flex;
        justify-content: center;
        align-items: center;
        height: 50px;
      }
      .card-title {
        font-family: "Fredoka";
        font-size: 1.1em;
        font-weight: 600;
        margin-bottom: 8px;
        line-height: 1.2;
      }
      .card-price {
        font-size: 0.95em;
        color: #000;
        font-weight: 800;
        background: var(--accent);
        display: inline-block;
        padding: 6px 12px;
        border-radius: 20px;
        border: 2px solid #000;
        margin-bottom: 15px;
        box-shadow: 2px 2px 0px #000;
      }

      /* Quantity Controls */
      .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--input-bg);
        border-radius: 12px;
        padding: 6px;
        border: 2px solid var(--border-color);
      }
      .controls button {
        color: white;
        border: 2px solid rgba(0, 0, 0, 0.2);
        width: 36px;
        height: 36px;
        border-radius: 10px;
        font-size: 1.2em;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition:
          transform 0.1s,
          filter 0.2s;
      }
      .controls button:active {
        transform: scale(0.9);
      }
      .controls button:hover {
        filter: brightness(1.1);
      }
      .btn-min {
        background: var(--btn-minus);
      }
      .btn-plus {
        background: var(--btn-plus);
      }
      .qty-display {
        font-family: "Fredoka";
        font-size: 1.2em;
        font-weight: 600;
        width: 30px;
      }

      /* Forms */
      .account-form {
        display: none;
        background: var(--bg-card);
        padding: 30px 25px;
        border-radius: 25px;
        border: 2px solid var(--border-color);
        margin-top: 40px;
        box-shadow: 6px 6px 0px var(--shadow-color);
        animation: fadeScale 0.4s ease;
      }
      .account-form input {
        width: 100%;
        background: var(--input-bg);
        border: 2px solid var(--border-color);
        color: var(--text-dark);
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 12px;
        outline: none;
        font-family: "Nunito", sans-serif;
        font-size: 1em;
        transition: all 0.3s ease;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
      }
      .account-form input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(255, 95, 162, 0.2);
      }

      /* Radio Button Box Styles */
      .radio-selection-wrapper {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
        margin-bottom: 20px;
        margin-top: 10px;
      }
      .radio-btn-custom {
        cursor: pointer;
        display: block;
      }
      .radio-btn-custom input {
        display: none;
      }
      .radio-box {
        background: var(--input-bg);
        border: 2px solid var(--border-color);
        border-radius: 12px;
        padding: 15px 10px;
        text-align: center;
        font-family: "Fredoka", sans-serif;
        font-size: 1em;
        font-weight: 600;
        color: var(--text-dark);
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 3px 3px 0px var(--shadow-color);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 5px;
      }
      .radio-btn-custom input:checked + .radio-box {
        background: var(--accent);
        color: #000;
        transform: translate(3px, 3px);
        box-shadow: 0px 0px 0px var(--shadow-color);
        border-color: #000;
      }

      /* Bottom Bar */
      .bottom-bar {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 40px);
        max-width: 860px;
        background: var(--bottom-bar);
        backdrop-filter: blur(15px);
        border: 2px solid var(--border-color);
        padding: 15px 25px;
        border-radius: 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 1000;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      }
      .bottom-price {
        color: var(--primary);
        font-family: "Fredoka";
        font-size: 1.6em;
        font-weight: 700;
        line-height: 1.1;
      }
      .btn-order {
        background: var(--primary);
        color: #fff;
        border: none;
        padding: 15px 35px;
        border-radius: 15px;
        font-family: "Fredoka";
        font-size: 1.1em;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 6px 15px rgba(255, 95, 162, 0.4);
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .btn-order:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(255, 95, 162, 0.5);
      }
      .btn-order:active {
        transform: translateY(2px);
        box-shadow: 0 2px 10px rgba(255, 95, 162, 0.4);
      }

      /* SweetAlert Overrides */
      .swal2-popup {
        font-family: "Nunito", sans-serif !important;
        border-radius: 25px !important;
        border: 2px solid var(--border-color) !important;
        background: var(--bg-card) !important;
        color: var(--text-dark) !important;
      }
      .swal2-title {
        font-family: "Fredoka", sans-serif !important;
      }
      .swal2-confirm {
        font-family: "Fredoka", sans-serif !important;
        border-radius: 12px !important;
        padding: 12px 30px !important;
        font-weight: 600 !important;
      }
    </style>
  </head>
  <body>
    <!-- Loader -->
    <div id="loader">
      <img
        src="logo.png"
        alt="Loading"
        onerror="
          this.src = 'https://placehold.co/120x120/ff5fa2/ffffff?text=ZHITA'
        "
      />
    </div>

    <!-- Toast Alert -->
    <div id="fake-alert">
      <div style="font-size: 1.5em">🛍️</div>
      <div id="alert-content"></div>
    </div>

    <!-- Hero -->
    <div class="hero">
      <button class="theme-btn" onclick="toggleTheme()" id="themeIcon">
        🌙
      </button>
      <img
        src="logo.png"
        class="store-logo"
        alt="Zhita Store"
        onerror="
          this.src =
            'https://placehold.co/160x160/ff5fa2/ffffff?text=ZHITA+STORE'
        "
      />
      <p>✨ Top Up Termurah & Tercepat! ✨</p>
    </div>

    <div class="container">
      <!-- Testimonials -->
      <div class="testi-container">
        <div class="testi-title">⭐ Testimoni Terpercaya</div>
        <div class="testi-wrapper" id="testiSlider">
          <script>
            for (let i = 1; i <= 10; i++) {
              document.write(
                `<div class="testi-card">
                  <img src="testi${i}.jpg" onerror="this.src='https://placehold.co/130x180/cccccc/2d3436?text=Testi+${i}'" />
                  <div class="testi-caption">Sukses #${i}</div>
                </div>`,
              );
            }
          </script>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="tabs">
        <button class="tab-btn active" onclick="bukaTab('sec-robux', this)">
          <img src="robux.png" class="tab-icon" alt="Robux" /> Robux
        </button>
        <button class="tab-btn" onclick="bukaTab('sec-uang', this)">
          💵 Uang DDS
        </button>
        <button class="tab-btn" onclick="bukaTab('sec-gp-dds', this)">
          🏍️ GP DDS
        </button>
        <button class="tab-btn" onclick="bukaTab('sec-gp-cdid', this)">
          🚗 GP CDID
        </button>
      </div>

      <!-- Categories -->
      <div id="sec-robux" class="category-section active">
        <div class="product-grid" id="robux-container"></div>
      </div>
      <div id="sec-uang" class="category-section">
        <div class="product-grid" id="uang-container"></div>
      </div>
      <div id="sec-gp-dds" class="category-section">
        <div class="product-grid" id="gamepass-container"></div>
      </div>
      <div id="sec-gp-cdid" class="category-section">
        <div class="product-grid" id="gp-cdid-container"></div>
      </div>

      <!-- Checkout Form -->
      <div class="account-form" id="account-section">
        <h3
          id="form-title"
          style="
            font-family: &quot;Fredoka&quot;;
            margin-bottom: 15px;
            font-size: 1.3em;
            text-align: center;
          "
        >
          🔐 Data Akun Kamu
        </h3>

        <input
          type="text"
          id="roblox-user"
          placeholder="Masukkan Username Roblox"
          autocomplete="off"
        />
        <input
          type="text"
          id="roblox-pass"
          placeholder="Masukkan Password Roblox"
          autocomplete="off"
        />

        <!-- Pilihan Admin (Hanya muncul jika bukan Robux) -->
        <div id="admin-select-container" style="display: none">
          <div
            style="
              font-family: &quot;Nunito&quot;;
              font-size: 0.95em;
              font-weight: 700;
              color: var(--text-dark);
            "
          >
            Pilih Admin Transaksi:
          </div>
          <div class="radio-selection-wrapper">
            <label class="radio-btn-custom">
              <input type="radio" name="admin" value="6281315732392" checked />
              <div class="radio-box">👨‍💻 Admin 1</div>
            </label>
            <label class="radio-btn-custom">
              <input type="radio" name="admin" value="6285284209386" />
              <div class="radio-box">👩‍💻 Admin 2</div>
            </label>
          </div>
        </div>

        <!-- Pilihan Metode Pembayaran (Muncul disemua checkout) -->
        <div id="payment-select-container">
          <div
            style="
              font-family: &quot;Nunito&quot;;
              font-size: 0.95em;
              font-weight: 700;
              color: var(--text-dark);
            "
          >
            Pilih Metode Pembayaran:
          </div>
          <div class="radio-selection-wrapper">
            <label class="radio-btn-custom">
              <input type="radio" name="payment" value="DANA" checked />
              <div class="radio-box">
                <img
                  src="https://upload.wikimedia.org/wikipedia/commons/7/72/Logo_dana_blue.svg"
                  alt="DANA"
                  class="pay-img"
                  onerror="this.src = 'dana.png'"
                />
              </div>
            </label>
            <label class="radio-btn-custom">
              <input type="radio" name="payment" value="QRIS" />
              <div class="radio-box">
                <img
                  src="https://upload.wikimedia.org/wikipedia/commons/a/a2/Logo_QRIS.svg"
                  alt="QRIS"
                  class="pay-img"
                  style="
                    background: #ffffff;
                    padding: 3px 6px;
                    border-radius: 6px;
                  "
                  onerror="this.src = 'qris.png'"
                />
              </div>
            </label>
          </div>
        </div>

        <p
          id="form-note"
          style="
            font-size: 0.85em;
            color: #d63031;
            font-weight: 700;
            text-align: center;
            background: rgba(214, 48, 49, 0.1);
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            display: none;
          "
        >
          ⚠️ Pastikan data akun yang dimasukkan sudah benar!
        </p>
      </div>
    </div>

    <!-- Bottom Action Bar -->
    <div class="bottom-bar">
      <div>
        <small
          style="
            font-family: &quot;Fredoka&quot;;
            font-weight: 600;
            opacity: 0.8;
          "
          >TOTAL BAYAR</small
        >
        <div class="bottom-price">Rp <span id="total-price">0</span></div>
      </div>
      <button class="btn-order" onclick="orderWhatsApp()">🛒 Checkout</button>
    </div>

    <script>
      // Loader Logic
      function hideLoader() {
        const loader = document.getElementById("loader");

      // Render Products
      function render() {
        products.forEach((p) => {
          let cid =
            p.cat === "robux"
              ? "robux-container"
              : p.cat === "uang_dds"
                ? "uang-container"
                : p.cat === "gp_dds"
                  ? "gamepass-container"
                  : "gp-cdid-container";

          let icon =
            p.cat === "robux"
              ? `<img src="robux.png" class="robux-img" alt="Robux" />`
              : p.cat === "uang_dds"
                ? "💵"
                : p.cat === "gp_dds"
                  ? "🏍️"
                  : "🚗";

          document.getElementById(cid).innerHTML += `
            <div class="card">
              <div>
                <div class="card-icon">${icon}</div>
                <div class="card-title">${p.name}</div>
                <div class="card-price">Rp ${p.price.toLocaleString("id-ID")}</div>
              </div>
              <div class="controls">
                <button class="btn-min" onclick="update('${p.id}',-1)">-</button>
                <div class="qty-display" id="qty-${p.id}">0</div>
                <button class="btn-plus" onclick="update('${p.id}',1)">+</button>
              </div>
            </div>
          `;
        });
      }
      render();

      // Cart System
      let cart = {};
      let total = 0;

      function update(id, chg) {
        let p = products.find((x) => x.id === id);
        let cur = cart[id] ? cart[id].qty : 0;
        let next = cur + chg;

        if (next < 0 || (p.isGp && next > 1)) return;

        if (next === 0) delete cart[id];
        else {
          cart[id] = {
            name: p.name,
            qty: next,
            price: p.price,
            game: p.game,
            cat: p.cat,
          };
        }

        document.getElementById("qty-" + id).innerText = next;

        total = 0;
        let hasR = false,
          hasO = false;

        for (let k in cart) {
          total += cart[k].qty * cart[k].price;
          if (cart[k].cat === "robux") hasR = true;
          else hasO = true;
        }

        document.getElementById("total-price").innerText =
          total.toLocaleString("id-ID");

        const accSection = document.getElementById("account-section");
        accSection.style.display = hasR || hasO ? "block" : "none";
        document.getElementById("roblox-pass").style.display = hasR
          ? "block"
          : "none";
        document.getElementById("form-note").style.display = hasR
          ? "block"
          : "none";

        document.getElementById("admin-select-container").style.display = hasO
          ? "block"
          : "none";

        const formTitle = document.getElementById("form-title");
        if (!hasR && hasO) {
          formTitle.innerHTML = "🎯 Target Pengiriman (Username)";
        } else {
          formTitle.innerHTML = "🔐 Data Akun Roblox";
        }
      }

      function orderWhatsApp() {
        if (total === 0) {
          return Swal.fire({
            icon: "warning",
            title: "Keranjang Kosong",
            text: "Silakan pilih produk yang ingin dibeli terlebih dahulu.",
            confirmButtonColor: "var(--primary)",
          });
        }

        let hasR = Object.values(cart).some((i) => i.cat === "robux");
        let hasO = Object.values(cart).some((i) => i.cat !== "robux");

        let u = document.getElementById("roblox-user").value.trim();
        let p = document.getElementById("roblox-pass").value.trim();

        if (hasR) {
          if (!u || !p)
            return Swal.fire({
              icon: "error",
              title: "Data Tidak Lengkap",
              text: "Username dan Password Roblox wajib diisi untuk order Robux!",
              confirmButtonColor: "#ff7675",
            });
        } else if (hasO) {
          if (!u)
            return Swal.fire({
              icon: "error",
              title: "Data Tidak Lengkap",
              text: "Masukkan Username Roblox penerima (Target Pengiriman)!",
              confirmButtonColor: "#ff7675",
            });
        }

        let selectedAdmin = document.querySelector(
          'input[name="admin"]:checked',
        )
          ? document.querySelector('input[name="admin"]:checked').value
          : "";
        let selectedPayment = document.querySelector(
          'input[name="payment"]:checked',
        ).value;
        let target = hasR && !hasO ? "6285837593034" : selectedAdmin;

        // FORMAT PESAN POLOS (TANPA ICON / EMOJI) BIKIN AMAN DARI ERROR
        let msg = "Halo Admin *Zhita Blox*, saya mau order:\n\n";
        msg += "*DETAIL PESANAN:*\n";

        for (let k in cart) {
          msg += `- [${cart[k].game}] ${cart[k].name} x${cart[k].qty} (Rp ${(cart[k].qty * cart[k].price).toLocaleString("id-ID")})\n`;
        }

        msg += "\n*DATA AKUN:*\n";
        msg += hasR
          ? `Username : ${u}\nPassword : ${p}`
          : `Kirim ke Username : ${u}`;

        msg += `\n\n*PEMBAYARAN:* ${selectedPayment}`;
        msg += `\n*TOTAL BAYAR: Rp ${total.toLocaleString("id-ID")}*`;

        window.open(
          "https://wa.me/" + target + "?text=" + encodeURIComponent(msg),
          "_blank",
        );
      }
