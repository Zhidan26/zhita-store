    <style>
      :root {
        --bg-main: #f0f8ff;
        --bg-card: #ffffff;
        --text-dark: #2d3436;
        --border-color: #2d3436;
        --shadow-color: #2d3436;
        --hero-bg: linear-gradient(135deg, #0b0f19 0%, #1a1025 100%);
        --tab-inactive: #ffffff;
        --bottom-bar: #ffffff;
        --input-bg: #f1f2f6;
        --primary: #ff6b6b;
        --accent: #ffe66d;
        --btn-plus: #2ed573;
        --btn-minus: #ff4757;
      }
      body.dark-mode {
        --bg-main: #111827;
        --bg-card: #1f2937;
        --text-dark: #f9fafb;
        --border-color: #000000;
        --shadow-color: #000000;
        --hero-bg: linear-gradient(135deg, #05080f 0%, #0d0514 100%);
        --tab-inactive: #374151;
        --bottom-bar: #1f2937;
        --input-bg: #374151;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: "Nunito", sans-serif;
        background-color: var(--bg-main);
        color: var(--text-dark);
        margin: 0;
        padding-bottom: 120px;
        background-image:
          radial-gradient(#4ecdc4 1.5px, transparent 1.5px),
          radial-gradient(#4ecdc4 1.5px, transparent 1.5px);
        background-size: 30px 30px;
        background-position:
          0 0,
          15px 15px;
        background-attachment: fixed;
        transition: 0.3s;
      }
      #loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--hero-bg);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: 0.5s;
      }
      #loader img {
        width: 150px;
        border-radius: 20px;
        border: 4px solid #ffffff;
        animation: pulseLogo 1s infinite alternate;
      }
      @keyframes pulseLogo {
        0% {
          transform: scale(0.9);
        }
        100% {
          transform: scale(1.1);
        }
      }
      #fake-alert {
        position: fixed;
        bottom: 100px;
        left: -350px;
        background: var(--bg-card);
        border: 3px solid var(--border-color);
        padding: 10px 15px;
        border-radius: 15px;
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 2000;
        box-shadow: 4px 4px 0px var(--shadow-color);
        transition: 0.5s ease;
      }
      #fake-alert.show {
        left: 15px;
      }

      .hero {
        position: relative;
        text-align: center;
        padding: 60px 20px 40px 20px;
        background: var(--hero-bg);
        border-bottom: 5px solid #8a2be2;
        border-radius: 0 0 30px 30px;
        margin-bottom: 15px;
        box-shadow: 0 10px 30px rgba(138, 43, 226, 0.3);
        overflow: hidden;
      }
      .store-logo {
        max-width: 250px;
        width: 100%;
        margin: 0 auto 15px auto;
        display: block;
        border-radius: 50%;
        box-shadow: 0 0 40px rgba(138, 43, 226, 0.4);
        position: relative;
        z-index: 2;
      }
      .hero p {
        color: #ffffff;
        font-size: 1.1em;
        font-weight: 800;
        background: rgba(138, 43, 226, 0.2);
        display: inline-block;
        padding: 8px 30px;
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(5px);
        position: relative;
        z-index: 2;
      }

      .testi-container {
        margin: 20px 0;
        padding: 0 15px;
      }
      .testi-title {
        font-family: "Fredoka";
        font-size: 1.2em;
        margin-bottom: 10px;
      }
      .testi-wrapper {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding-bottom: 10px;
        scrollbar-width: none;
        scroll-behavior: smooth;
      }
      .testi-card {
        min-width: 140px;
        height: 200px;
        background: var(--bg-card);
        border-radius: 12px;
        border: 2px solid var(--border-color);
        overflow: hidden;
        flex-shrink: 0;
        box-shadow: 3px 3px 0px var(--shadow-color);
        position: relative;
      }
      .testi-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .testi-caption {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        font-size: 0.8em;
        padding: 6px 0;
        text-align: center;
        font-family: "Fredoka";
        backdrop-filter: blur(3px);
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 0 15px;
      }

      .tabs {
        position: sticky;
        top: 0;
        z-index: 100;
        background-color: var(--bg-main);
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
        overflow-x: auto;
        padding: 15px 5px 15px 5px;
        scrollbar-width: none;
        transition: 0.3s;
      }
      .tab-btn {
        background: var(--tab-inactive);
        color: var(--text-dark);
        border: 3px solid var(--border-color);
        padding: 10px 15px;
        border-radius: 20px;
        font-family: "Fredoka";
        cursor: pointer;
        box-shadow: 3px 3px 0px var(--shadow-color);
        transition: 0.2s;
        white-space: nowrap;
      }
      .tab-btn.active {
        background: var(--accent);
        color: #2d3436;
        transform: translate(2px, 2px);
        box-shadow: none;
      }

      .category-section {
        display: none;
        animation: fadeIn 0.4s ease;
      }
      .category-section.active {
        display: block;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }
      @media (min-width: 600px) {
        .product-grid {
          grid-template-columns: repeat(3, 1fr);
          gap: 20px;
        }
      }

      .card {
        background: var(--bg-card);
        border: 3px solid var(--border-color);
        border-radius: 20px;
        padding: 15px;
        text-align: center;
        box-shadow: 4px 4px 0px var(--shadow-color);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .card-title {
        font-family: "Fredoka";
        font-size: 1.05em;
        margin: 5px 0;
      }
      .card-price {
        font-size: 0.95em;
        color: #ff4757;
        font-weight: 800;
        background: var(--accent);
        padding: 3px 8px;
        border-radius: 10px;
        border: 2px solid #2d3436;
        margin-bottom: 10px;
      }
      .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--input-bg);
        border-radius: 12px;
        padding: 5px;
        border: 2px solid var(--border-color);
      }
      .controls button {
        color: white;
        border: 2px solid #2d3436;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
      }
      .btn-min {
        background: var(--btn-minus);
      }
      .btn-plus {
        background: var(--btn-plus);
      }

      .account-form {
        display: none;
        background: var(--bg-card);
        padding: 25px 20px;
        border-radius: 20px;
        border: 4px solid var(--border-color);
        margin-top: 30px;
        box-shadow: 6px 6px 0px var(--shadow-color);
      }
      .account-form input {
        width: 100%;
        background: var(--input-bg);
        border: 3px solid var(--border-color);
        color: var(--text-dark);
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 10px;
        outline: none;
        font-family: "Nunito", sans-serif;
      }

      /* GAYA BARU UNTUK PILIHAN ADMIN (RADIO BUTTON KARTU) */
      .admin-selection-wrapper {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 15px;
}
      .admin-radio {
        flex: 1;
        cursor: pointer;
      }
      .admin-radio input {
        display: none; /* Sembunyikan bulatan radio aslinya */
      }
      .admin-box {
        background: var(--input-bg);
        border: 3px solid var(--border-color);
        border-radius: 10px;
        padding: 12px 5px;
        text-align: center;
        font-family: "Fredoka", sans-serif;
        font-size: 0.95em;
        font-weight: 600;
        color: var(--text-dark);
        transition: all 0.2s ease;
      }
      /* Efek ketika Admin dipilih */
      .admin-radio input:checked + .admin-box {
        background: var(--accent);
        transform: translateY(-3px);
        box-shadow: 4px 4px 0px var(--shadow-color);
        border-color: #2d3436;
      }

      .bottom-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--bottom-bar);
        border-top: 4px solid var(--border-color);
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 1000;
      }
      .bottom-price {
        color: #ff4757;
        font-family: "Fredoka";
        font-size: 1.5em;
      }
      .btn-order {
        background: var(--accent);
        color: #2d3436;
        border: 3px solid #2d3436;
        padding: 12px 20px;
        border-radius: 15px;
        font-family: "Fredoka";
        cursor: pointer;
        box-shadow: 4px 4px 0px #2d3436;
      }

      .swal2-popup {
        font-family: "Nunito", sans-serif !important;
        border-radius: 20px !important;
        border: 3px solid #2d3436 !important;
        box-shadow: 6px 6px 0px #2d3436 !important;
      }
      .swal2-confirm {
        font-family: "Fredoka", sans-serif !important;
        border-radius: 10px !important;
        border: 2px solid #2d3436 !important;
      }
    </style>

          id: "cdid_max",
          cat: "gp_cdid",
          game: "CDID",
          isGp: true,
          name: "Max Car Slot",
          price: 100000,
        },
      ];

      function render() {
        products.forEach((p) => {
          let cid =
            p.cat === "robux"
              ? "robux-container"
              : p.cat === "uang_dds"
                ? "uang-container"
                : p.cat === "gp_dds"
                  ? "gamepass-container"
                  : "gp-cdid-container";
          document.getElementById(cid).innerHTML += `
            <div class="card">
                <div><div class="card-icon">🎮</div><div class="card-title">${p.name}</div><div class="card-price">Rp ${p.price.toLocaleString("id-ID")}</div></div>
                <div class="controls">
                    <button class="btn-min" onclick="update('${p.id}',-1)">-</button>
                    <div id="qty-${p.id}">0</div>
                    <button class="btn-plus" onclick="update('${p.id}',1)">+</button>
                </div>
            </div>`;
        });
      }
      render();

      let cart = {};
      let total = 0;

      function update(id, chg) {
        let p = products.find((x) => x.id === id);
        let cur = cart[id] ? cart[id].qty : 0;
        let next = cur + chg;
        if (next < 0 || (p.isGp && next > 1)) return;
        if (next === 0) delete cart[id];
        else
          cart[id] = {
            name: p.name,
            qty: next,
            price: p.price,
            game: p.game,
            cat: p.cat,
          };

        document.getElementById("qty-" + id).innerText = next;
        total = 0;
        let hasR = false;
        let hasO = false;
        for (let k in cart) {
          total += cart[k].qty * cart[k].price;
          if (cart[k].cat === "robux") hasR = true;
          else hasO = true;
        }

        document.getElementById("total-price").innerText =
          total.toLocaleString("id-ID");
        document.getElementById("account-section").style.display =
          hasR || hasO ? "block" : "none";
        document.getElementById("roblox-pass").style.display = hasR
          ? "block"
          : "none";

        // Memunculkan Pilihan Admin yang baru
        document.getElementById("admin-select-container").style.display = hasO
          ? "block"
          : "none";

        if (!hasR && hasO)
          document.getElementById("form-title").innerText =
            "🎯 Target Pengiriman (Username)";
        else
          document.getElementById("form-title").innerText =
            "🔐 Data Akun Roblox";
      }

      function orderWhatsApp() {
        if (total === 0) {
          return Swal.fire({
            icon: "warning",
            title: "Ups!",
            text: "Pilih barang terlebih dahulu di keranjang.",
            confirmButtonColor: "#ff6b6b",
          });
        }

        let hasR = Object.values(cart).some((i) => i.cat === "robux");
        let hasO = Object.values(cart).some((i) => i.cat !== "robux");

        let u = document.getElementById("roblox-user").value.trim();
        let p = document.getElementById("roblox-pass").value.trim();

        if (hasR) {
          if (!u || !p)
            return Swal.fire({
              icon: "error",
              title: "Data Belum Lengkap",
              text: "Mohon isi Username dan Password Roblox untuk orderan Robux!",
              confirmButtonColor: "#ff4757",
            });
        } else if (hasO) {
          if (!u)
            return Swal.fire({
              icon: "error",
              title: "Data Belum Lengkap",
              text: "Mohon isi Username Roblox target pengiriman!",
              confirmButtonColor: "#ff4757",
            });
        }

        // Ambil nomor tujuan dari radio button yang dipilih
        let selectedAdmin = document.querySelector(
          'input[name="admin"]:checked',
        ).value;
        let target = hasR && !hasO ? "6285837593034" : selectedAdmin;

        let msg = "Halo Admin Zhita Store, order dong:\n\n";
        for (let k in cart)
          msg += `[${cart[k].game}] ${cart[k].name} x${cart[k].qty} (Rp ${cart[k].qty * cart[k].price})\n`;
        msg += hasR
          ? `\nLOGIN:\nUser: ${u}\nPass: ${p}`
          : `\nKIRIM KE:\nUser: ${u}`;
        msg += `\n\nTOTAL: Rp ${total.toLocaleString("id-ID")}`;

        window.open(
          "https://wa.me/" + target + "?text=" + encodeURIComponent(msg),
          "_blank",
        );
      }
    </script>
  </body>
</html>
