    <title>Zhita Store - Top Up & Gamepass</title>

      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-main: #f0f8ff;
        --bg-card: #ffffff;
        --text-dark: #2d3436;
        --border-color: #2d3436;
        --shadow-color: #2d3436;
        --hero-bg: linear-gradient(135deg, #0b0f19 0%, #1a1025 100%);
        --tab-inactive: #ffffff;
        --bottom-bar: #ffffff;
        --input-bg: #f1f2f6;
        --primary: #ff6b6b;
        --accent: #ffe66d;
        --btn-plus: #2ed573;
        --btn-minus: #ff4757;
      }

      body.dark-mode {
        --bg-main: #111827;
        --bg-card: #1f2937;
        --text-dark: #f9fafb;
        --border-color: #000000;
        --shadow-color: #000000;
        --hero-bg: linear-gradient(135deg, #05080f 0%, #0d0514 100%);
        --tab-inactive: #374151;
        --bottom-bar: #1f2937;
        --input-bg: #374151;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: "Nunito", sans-serif;
        background-color: var(--bg-main);
        color: var(--text-dark);
        margin: 0;
        padding: 0;
        padding-bottom: 120px;
        background-image:
          radial-gradient(#4ecdc4 1.5px, transparent 1.5px),
          radial-gradient(#4ecdc4 1.5px, transparent 1.5px);
        background-size: 30px 30px;
        background-position:
          0 0,
          15px 15px;
        background-attachment: fixed;
        transition:
          background-color 0.3s,
          color 0.3s;
      }

      #loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--hero-bg);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        transition:
          opacity 0.5s ease,
          visibility 0.5s ease;
      }

      #loader img {
        width: 150px;
        border-radius: 20px;
        border: 4px solid #ffffff;
        box-shadow: 0 0 20px rgba(138, 43, 226, 0.5);
        animation: pulseLogo 1s infinite alternate;
      }

      @keyframes pulseLogo {
        0% {
          transform: scale(0.9);
        }
        100% {
          transform: scale(1.1);
        }
      }

      .dark-mode-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.2);
        color: white;
        font-size: 1.2em;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
        z-index: 10;
        display: flex;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(5px);
      }

      .hero {
        position: relative;
        text-align: center;
        padding: 60px 20px 40px 20px;
        background: var(--hero-bg);
        border-bottom: 5px solid #8a2be2;
        border-radius: 0 0 30px 30px;
        margin-bottom: 25px;
        box-shadow: 0 10px 30px rgba(138, 43, 226, 0.3);
        overflow: hidden;
      }

      .hero::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image:
          radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0, 0, 0, 0)),
          radial-gradient(2px 2px at 160px 120px, #d8b4fe, rgba(0, 0, 0, 0));
        background-size: 200px 200px;
        opacity: 0.3;
        z-index: 0;
      }

      .store-logo {
        max-width: 280px;
        width: 100%;
        height: auto;
        margin: 0 auto 20px auto;
        display: block;
        position: relative;
        z-index: 2;
        border-radius: 50%;
        box-shadow: 0 0 40px rgba(138, 43, 226, 0.4);
      }

      .hero p {
        color: #ffffff;
        font-size: 1.1em;
        font-weight: 800;
        margin: 0;
        background: rgba(138, 43, 226, 0.2);
        display: inline-block;
        padding: 8px 30px;
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 0 15px rgba(138, 43, 226, 0.5);
        position: relative;
        z-index: 2;
        backdrop-filter: blur(5px);
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 0 15px;
      }

      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
        overflow-x: auto;
        padding: 5px;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }

      .tab-btn {
        background: var(--tab-inactive);
        color: var(--text-dark);
        border: 3px solid var(--border-color);
        padding: 10px 15px;
        border-radius: 20px;
        font-family: "Fredoka", sans-serif;
        font-size: 1em;
        cursor: pointer;
        box-shadow: 3px 3px 0px var(--shadow-color);
        transition: 0.2s;
        white-space: nowrap;
      }

      .tab-btn.active {
        background: var(--accent);
        color: #2d3436;
        transform: translate(3px, 3px);
        box-shadow: none;
      }

      .category-section {
        display: none;
        animation: fadeIn 0.4s ease;
      }
      .category-section.active {
        display: block;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }
      @media (min-width: 600px) {
        .product-grid {
          grid-template-columns: repeat(3, 1fr);
          gap: 20px;
        }
      }

      .card {
        background: var(--bg-card);
        border: 3px solid var(--border-color);
        border-radius: 20px;
        padding: 15px;
        text-align: center;
        position: relative;
        box-shadow: 4px 4px 0px var(--shadow-color);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .card-icon {
        font-size: 3em;
        margin-bottom: 5px;
        display: inline-block;
        filter: drop-shadow(2px 2px 0px rgba(0, 0, 0, 0.2));
      }
      .card-title {
        font-family: "Fredoka", sans-serif;
        font-size: 1.1em;
        color: var(--text-dark);
        margin-bottom: 5px;
      }
      .card-price {
        font-size: 1em;
        color: #ff4757;
        font-weight: 800;
        margin-bottom: 15px;
        background: var(--accent);
        padding: 3px 8px;
        border-radius: 10px;
        display: inline-block;
        border: 2px solid #2d3436;
      }

      .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--input-bg);
        border-radius: 12px;
        padding: 5px;
        border: 2px solid var(--border-color);
      }
      .controls button {
        color: white;
        border: 2px solid #2d3436;
        width: 35px;
        height: 35px;
        border-radius: 10px;
        font-size: 1.5em;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .btn-min {
        background: var(--btn-minus);
        box-shadow: 0 3px 0 #c0392b;
      }
      .btn-plus {
        background: var(--btn-plus);
        box-shadow: 0 3px 0 #218c53;
      }
      .controls button:disabled {
        background: #bdc3c7;
        box-shadow: 0 3px 0 #95a5a6;
        cursor: not-allowed;
        border-color: #7f8c8d;
      }

      .account-form {
        display: none;
        background: var(--bg-card);
        padding: 25px 20px;
        border-radius: 20px;
        border: 4px solid var(--border-color);
        margin-top: 30px;
        box-shadow: 6px 6px 0px var(--shadow-color);
        position: relative;
      }
      .account-form::before {
        content: "INFO PENTING! 📝";
        position: absolute;
        top: -15px;
        left: 20px;
        background: var(--accent);
        border: 2px solid #2d3436;
        padding: 5px 15px;
        border-radius: 15px;
        font-family: "Fredoka", sans-serif;
        font-size: 0.9em;
        color: #2d3436;
        box-shadow: 2px 2px 0px #2d3436;
      }
      .account-form input {
        width: 100%;
        background: var(--input-bg);
        border: 3px solid var(--border-color);
        color: var(--text-dark);
        padding: 15px;
        margin-bottom: 12px;
        border-radius: 12px;
        font-family: "Nunito", sans-serif;
        font-weight: 700;
        font-size: 1em;
        outline: none;
      }
      .form-note {
        font-size: 0.9em;
        color: #ff4757;
        font-weight: 800;
        margin: 0;
        text-align: center;
        background: #ffcccc;
        padding: 8px;
        border-radius: 8px;
        border: 2px dashed #ff4757;
      }

      .bottom-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--bottom-bar);
        border-top: 4px solid var(--border-color);
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 1000;
        box-shadow: 0 -10px 20px rgba(0, 0, 0, 0.1);
      }
      .bottom-price {
        color: #ff4757;
        font-family: "Fredoka", sans-serif;
        font-size: 1.6em;
      }
      .btn-order {
        background: var(--accent);
        color: #2d3436;
        border: 3px solid #2d3436;
        padding: 12px 25px;
        border-radius: 15px;
        font-family: "Fredoka", sans-serif;
        font-size: 1.2em;
        cursor: pointer;
        box-shadow: 4px 4px 0px #2d3436;
      }
    </style>
  </head>

      function toggleTheme() {
        document.body.classList.toggle("dark-mode");
        const isDark = document.body.classList.contains("dark-mode");
        document.getElementById("theme-icon").innerText = isDark ? "☀️" : "🌙";
        localStorage.setItem("zhita_theme", isDark ? "dark" : "light");
      }
      if (localStorage.getItem("zhita_theme") === "dark") toggleTheme();

        document
          .querySelectorAll(".tab-btn")
          .forEach((el) => el.classList.remove("active"));
        document.getElementById(tabId).classList.add("active");
        elementTombol.classList.add("active");
      }

      function render() {
        products.forEach((p) => {
          let containerId =
            p.cat === "robux"
              ? "robux-container"
              : p.cat === "uang_dds"
                ? "uang-container"
                : p.cat === "gp_dds"
                  ? "gamepass-container"
                  : "gp-cdid-container";
          document.getElementById(containerId).innerHTML += `
                <div class="card">
                    <div><div class="card-icon">${p.icon}</div><div class="card-title">${p.name}</div><div class="card-price">Rp ${p.price.toLocaleString("id-ID")}</div></div>
                    <div class="controls">
                        <button class="btn-min" onclick="update('${p.id}', -1)" id="btn-minus-${p.id}">-</button>
                        <div class="qty-display" id="qty-${p.id}" style="font-family:'Fredoka'">0</div>
                        <button class="btn-plus" onclick="update('${p.id}', 1)" id="btn-plus-${p.id}">+</button>
                    </div>
                </div>`;
        });
      }
      render();

      let cart = {};
      let total = 0;

      function update(id, change) {
        let p = products.find((x) => x.id === id);
        let current = cart[id] ? cart[id].qty : 0;
        let next = current + change;
        if (next < 0 || (p.isGamepass && next > 1)) return;
        if (next === 0) delete cart[id];
        else
          cart[id] = {
            name: p.name,
            qty: next,
            price: p.price,
            cat: p.cat,
            game: p.game,
          };
        document.getElementById("qty-" + id).innerText = next;
        if (p.isGamepass)
          document.getElementById(`btn-plus-${id}`).disabled = next >= 1;
        total = 0;
        let hasRobux = false;
        let hasOther = false;
        for (let key in cart) {
          total += cart[key].qty * cart[key].price;
          if (cart[key].cat === "robux") hasRobux = true;
          else hasOther = true;
        }
        document.getElementById("total-price").innerText =
          total.toLocaleString("id-ID");
        document.getElementById("account-section").style.display =
          hasRobux || hasOther ? "block" : "none";
        document.getElementById("roblox-pass").style.display = hasRobux
          ? "block"
          : "none";
      }

      function orderWhatsApp() {
        if (total === 0) return alert("Pilih barang dulu!");

        let hasRobux = Object.values(cart).some((i) => i.cat === "robux");
        let hasOther = Object.values(cart).some((i) => i.cat !== "robux");
        let rUser = document.getElementById("roblox-user").value.trim();
        let rPass = document.getElementById("roblox-pass").value.trim();

        if (
          (hasRobux && (rUser === "" || rPass === "")) ||
          (!hasRobux && hasOther && rUser === "")
        ) {
          return alert("Lengkapi data akun!");
        }

        let targetNum =
          hasRobux && !hasOther
            ? "6285837593034"
            : !hasRobux && hasOther
              ? "62881081022604"
              : confirm("OK untuk Admin Gamepass, Cancel untuk Admin Robux")
                ? "62881081022604"
                : "6285837593034";

        // Menggunakan format yang sangat sederhana tanpa simbol aneh
        let msg = "Halo Admin Zhita Store, saya mau order:\n\n";

        for (let key in cart) {
          let item = cart[key];
          let subtotal = item.qty * item.price;
          // Format: [GAME] NAMA x JUMLAH (Rp HARGA)
          msg +=
            "[" +
            item.game +
            "] " +
            item.name +
            " x" +
            item.qty +
            " (Rp " +
            subtotal +
            ")\n";
        }

        if (hasRobux) {
          msg += "\nDATA LOGIN:\nUser: " + rUser + "\nPass: " + rPass + "\n";
        } else {
          msg += "\nKIRIM KE:\nUser: " + rUser + "\n";
        }

        msg += "\nTOTAL TAGIHAN: Rp " + total;

        // Gunakan pembersihan teks ekstra sebelum dikirim
        let finalMsg = msg.replace(/[^\x00-\x7F]/g, "");

        window.open(
          "https://wa.me/" + targetNum + "?text=" + encodeURIComponent(msg),
          "_blank",
        );
      }
